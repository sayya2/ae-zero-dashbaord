services:
  mysql:
    image: mysql:8.0
    container_name: ae_dashboard_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ae_dashboard
      MYSQL_USER: ae_admin
      MYSQL_PASSWORD: ae_dashboard_pass
    ports:
      - "3307:3306"
    volumes:
      - dashboard_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ae_dashboard_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: mysql://ae_admin:ae_dashboard_pass@mysql:3306/ae_dashboard
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dashboard_mysql:
